version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vehicle_backend
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - vehicle_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vehicle_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vehicle_data:
    driver: local
